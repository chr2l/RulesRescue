name: Auto-merge Claude PRs
# Fusionne automatiquement les PR ouvertes depuis une branche claude/*,
# UNIQUEMENT si le dépôt est privé et si la PR vient de ce même dépôt (pas d'un fork).
# Si le dépôt devient public, plus rien n'est fusionné et le job "warn-public"
# échoue volontairement pour te prévenir (notification GitHub d'échec de workflow).
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.repository.private == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  warn-public:
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::ATTENTION : ce dépôt est PUBLIC. L'auto-merge des PR claude/* est désactivé par sécurité. Repasse le dépôt en privé ou supprime .github/workflows/automerge.yml."
          exit 1
