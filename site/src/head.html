<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rules Rescue</title><meta name="description" content="Retrouver et récupérer ses cartes Rules (rules.art) sur Starknet après la fermeture du site."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Inconsolata:wght@500;700&display=swap"><style>
/* Layout: classeur de collection — bandeau compteur, rail de filtres collant, grille de cartes au format 0.63 */
:root {
  --bg: #0d1114;
  --surface: #191b1d;
  --line: #33373b;
  --fg: #f7f7f7;
  --muted: #828585;
  --accent: #9f04dc;
  --accent-soft: rgba(159, 4, 220, .16);
  --holo: #56c8fe;
  --plat: #e7e7e7;
  --hallo: #e0672a;
  --chip-fg: #f7f7f7;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Inconsolata", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceeef; --surface: #ffffff; --line: #cfd3d6; --fg: #0d1114; --muted: #5d6266;
    --accent: #8d04c3; --accent-soft: rgba(141, 4, 195, .1); --holo: #0a86c2; --plat: #6d7378; --hallo: #b8471a; --chip-fg: #ffffff;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceeef; --surface: #ffffff; --line: #cfd3d6; --fg: #0d1114; --muted: #5d6266;
  --accent: #8d04c3; --accent-soft: rgba(141, 4, 195, .1); --holo: #0a86c2; --plat: #6d7378; --hallo: #b8471a; --chip-fg: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Bandeau */
header { padding-block: 40px 24px; display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.brand svg { width: 34px; height: 34px; flex: none; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 8vw, 92px); line-height: .9; margin: 0; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
h1 span { color: var(--accent); }
.counter { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; display: grid; gap: 2px; min-width: 110px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.wallet { font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.wallet a { color: inherit; }

/* Filtres */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-block: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 600 13px/1 var(--body); color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--chip-fg); }
.seg button:hover { border-color: var(--accent); }
select, input[type="search"] { font: 500 14px/1 var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; height: 34px; }
input[type="search"] { flex: 1 1 180px; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

/* Grille */
main { padding-block: 24px 64px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
.card { display: grid; gap: 8px; background: none; border: 0; padding: 0; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.frame { position: relative; aspect-ratio: 214 / 300; max-width: 100%; overflow: hidden; background: var(--surface); border-radius: 6px; transition: transform .25s ease; }
.frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card:hover .frame, .card:focus-visible .frame { transform: translateY(-4px) rotate(-1deg); }
.frame.holo::after, .frame.plat::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .0; transition: opacity .3s; background: linear-gradient(115deg, transparent 20%, rgba(255,0,200,.55) 36%, rgba(0,230,255,.55) 48%, rgba(255,255,120,.5) 60%, transparent 76%); background-size: 250% 250%; background-position: var(--px, 50%) var(--py, 50%); }
.frame.plat::after { background: linear-gradient(115deg, transparent 25%, rgba(255,255,255,.7) 45%, transparent 65%); background-size: 250% 250%; background-position: var(--px, 50%) var(--py, 50%); }
.card:hover .frame.holo::after, .card:hover .frame.plat::after { opacity: .75; }
.qty { position: absolute; top: 6px; right: 6px; font: 700 12px/1 var(--mono); background: var(--accent); color: #fff; padding: 4px 6px; }
.meta { display: grid; gap: 2px; min-width: 0; }
.meta strong { font-weight: 700; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.meta span { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 5px; border: 1px solid currentColor; }
.r-C { color: var(--muted); } .r-H { color: var(--holo); } .r-P { color: var(--plat); } .r-W { color: var(--hallo); } .r-K { color: var(--accent); }
.empty { padding: 48px 0; color: var(--muted); font-family: var(--mono); }

/* Fiche */
dialog { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; max-width: min(760px, calc(100vw - 32px)); width: 100%; }
dialog::backdrop { background: rgba(5, 6, 8, .78); }
.sheet { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; padding: 24px; }
.sheet .frame { cursor: default; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1; margin: 0 0 16px; text-transform: uppercase; text-wrap: balance; }
.sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 20px; font-size: 14px; }
.sheet dt { font-family: var(--mono); color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; padding-top: 2px; }
.sheet dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sheet a { color: var(--accent); }
.close { position: absolute; top: 8px; right: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); width: 36px; height: 36px; font-size: 20px; cursor: pointer; }
.nav { display: flex; gap: 8px; }
.nav button { font: 600 13px/1 var(--body); background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
footer { border-top: 1px solid var(--line); padding-block: 20px 40px; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sheet { grid-template-columns: 1fr; }
  .sheet > .frame { max-width: 240px; }
  .count { margin-left: 0; width: 100%; }
  .bar { position: static; }
}

/* Navigation + pages guide */
.topnav { border-bottom: 1px solid var(--line); background: var(--bg); }
.topnav .wrap { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; padding-block: 12px; }
.topnav .tag { font: 700 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: auto; }
.topnav a { font: 600 14px/1 var(--body); color: var(--fg); text-decoration: none; padding: 8px 0; border-bottom: 2px solid transparent; }
.topnav a[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
.doc { padding-block: 40px 64px; max-width: 820px; }
.eyebrow { font: 700 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
.doc-h { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5.5vw, 52px); line-height: 1; text-transform: uppercase; margin: 0 0 18px; text-wrap: balance; }
.lede { font-size: 17px; max-width: 65ch; margin: 0 0 24px; }
.doc p, .doc li { max-width: 68ch; }
.doc a { color: var(--accent); }
.doc code { font-family: var(--mono); font-size: .92em; background: var(--surface); border: 1px solid var(--line); padding: 1px 5px; overflow-wrap: anywhere; }
.warn { border: 1px solid var(--accent); background: var(--accent-soft); padding: 14px 16px; margin: 0 0 32px; max-width: 68ch; }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 34px; }
.steps > li { counter-increment: s; display: grid; grid-template-columns: 52px minmax(0, 1fr); column-gap: 14px; }
.steps > li::before { content: counter(s); grid-row: span 9; font-family: var(--display); font-size: 40px; line-height: 1; color: var(--accent); }
.steps h3 { margin: 4px 0 8px; font-size: 19px; }
.steps p { margin: 0 0 10px; }
.steps ul { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 6px; }
.mini { border-collapse: collapse; margin: 6px 0 12px; font-size: 14px; }
.mini th, .mini td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
.mini th { font: 700 12px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.note { font-family: var(--mono); font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; margin-top: 36px; }
.cmds pre, .code { font: 500 13px/1.5 var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 14px; overflow-x: auto; margin: 0 0 16px; }
.code { max-height: 460px; overflow: auto; white-space: pre; }
.code.short { max-height: 200px; }
.codehead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; font: 700 12px/1 var(--mono); color: var(--muted); }
.copy { font: 600 13px/1 var(--body); background: var(--accent); color: var(--chip-fg); border: 0; padding: 9px 12px; cursor: pointer; }
@media (max-width: 560px) { .steps > li { grid-template-columns: 34px minmax(0, 1fr); } .steps > li::before { font-size: 28px; } }
@media (prefers-reduced-motion: reduce) { .frame, .frame::after { transition: none; } .card:hover .frame { transform: none; } }

.lookup { display: grid; gap: 8px; max-width: 760px; }
.lab { font: 700 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lookup .row { display: flex; flex-wrap: wrap; gap: 8px; }
.lookup input { flex: 1 1 280px; min-width: 0; font: 500 15px/1 var(--mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line); padding: 12px; }
.go { font: 700 15px/1 var(--body); background: var(--accent); color: var(--chip-fg); border: 0; padding: 12px 18px; cursor: pointer; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
.status { font-family: var(--mono); font-size: 13px; color: var(--muted); margin: 0; min-height: 1.2em; overflow-wrap: anywhere; }
.status a, .empty a, footer a { color: var(--accent); }
.dl { font: 600 13px/1 var(--body); color: var(--fg); border: 1px solid var(--line); padding: 9px 12px; text-decoration: none; }
.sub { font-size: 20px; margin: 34px 0 10px; }
.plain { padding-left: 20px; display: grid; gap: 8px; max-width: 68ch; }
.doc .code { white-space: pre-wrap; }
.empty { max-width: 65ch; font-family: var(--body); line-height: 1.6; }
</style><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
