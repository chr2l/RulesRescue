/* Layout: classeur de collection — bandeau compteur, rail de filtres collant, grille de cartes au format 0.63 */
:root {
  --bg: #0d1114;
  --surface: #191b1d;
  --line: #33373b;
  --fg: #f7f7f7;
  --muted: #828585;
  --accent: #9f04dc;
  --accent-soft: rgba(159, 4, 220, .16);
  --holo: #56c8fe;
  --plat: #e7e7e7;
  --hallo: #e0672a;
  --chip-fg: #f7f7f7;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Inconsolata", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Bandeau */
header { padding-block: 40px 24px; display: grid; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.brand svg { width: 34px; height: 34px; flex: none; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 8vw, 92px); line-height: .9; margin: 0; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance; }
h1 span { color: var(--accent); }
.counter { display: flex; flex-wrap: wrap; gap: 8px; }
.quick, .box { border: 1px solid var(--line); background: var(--surface); padding: 14px 18px; margin: 18px 0; }
.quick { border-left: 4px solid var(--accent); }
.box h3 { margin-top: 0; }
.sit td:first-child { white-space: nowrap; }
@media (max-width: 640px) { .sit td:first-child { white-space: normal; } }
.hist { border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; margin-top: 12px; }
.hist summary { cursor: pointer; font-weight: 600; }
.hist[open] summary { margin-bottom: 10px; }
.hist .stat { max-width: 220px; }
.hist .why { font-size: 12px; color: var(--muted); line-height: 1.35; }
.stat { border: 1px solid var(--line); background: var(--surface); padding: 10px 14px; display: grid; gap: 2px; min-width: 110px; }
.stat b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat small { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.wallet { font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.wallet a { color: inherit; }

/* Filtres */
.bar { position: sticky; top: 49px; z-index: 5; background: var(--bg); border-block: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { font: 600 13px/1 var(--body); color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--chip-fg); }
.seg button:hover { border-color: var(--accent); }
select, input[type="search"] { font: 500 14px/1 var(--body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; height: 34px; }
input[type="search"] { flex: 1 1 180px; min-width: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

/* Grille */
main { padding-block: 24px 64px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
.card { display: grid; gap: 8px; background: none; border: 0; padding: 0; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.frame { position: relative; aspect-ratio: 214 / 300; max-width: 100%; overflow: hidden; background: var(--surface); border-radius: 4.5% / 3.2%; box-shadow: 0 0 0 1px var(--line); transition: transform .25s ease; }
.frame img { width: 100%; height: 100%; object-fit: contain; display: block; }
.card:hover .frame, .card:focus-visible .frame { transform: translateY(-4px) rotate(-1deg); }
.frame.holo::after, .frame.plat::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .0; transition: opacity .3s; background: linear-gradient(115deg, transparent 20%, rgba(255,0,200,.55) 36%, rgba(0,230,255,.55) 48%, rgba(255,255,120,.5) 60%, transparent 76%); background-size: 250% 250%; background-position: var(--px, 50%) var(--py, 50%); }
.frame.plat::after { background: linear-gradient(115deg, transparent 25%, rgba(255,255,255,.7) 45%, transparent 65%); background-size: 250% 250%; background-position: var(--px, 50%) var(--py, 50%); }
.frame.holo { box-shadow: 0 0 0 1px var(--holo), 0 0 18px -6px var(--holo); } .frame.plat { box-shadow: 0 0 0 1px var(--plat), 0 0 18px -6px var(--plat); }
.card:hover .frame.holo::after, .card:hover .frame.plat::after { opacity: .75; }
.qty { position: absolute; top: 6px; right: 6px; font: 700 12px/1 var(--mono); background: var(--accent); color: #fff; padding: 4px 6px; }
.meta { display: grid; gap: 2px; min-width: 0; }
.meta strong { font-weight: 700; font-size: 14px; line-height: 1.25; overflow-wrap: anywhere; }
.meta span { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pill { font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 3px 5px; border: 1px solid currentColor; }
.r-C { color: var(--muted); } .r-H { color: var(--holo); } .r-P { color: var(--plat); } .r-W { color: var(--hallo); } .r-L { color: #ff6b4a; } .r-K { color: var(--accent); }
.empty { padding: 48px 0; color: var(--muted); font-family: var(--mono); }

/* Fiche */
dialog { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; max-width: min(760px, calc(100vw - 32px)); width: 100%; }
dialog::backdrop { background: rgba(5, 6, 8, .78); }
.sheet { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; padding: 24px; }
.sheet .frame { cursor: default; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 40px); line-height: 1; margin: 0 0 16px; text-transform: uppercase; text-wrap: balance; }
.sheet dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 20px; font-size: 14px; }
.sheet dt { font-family: var(--mono); color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; padding-top: 2px; }
.sheet dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sheet a { color: var(--accent); }
.close { position: absolute; top: 8px; right: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); width: 36px; height: 36px; font-size: 20px; cursor: pointer; }
.nav { display: flex; gap: 8px; }
.nav button { font: 600 13px/1 var(--body); background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
footer { border-top: 1px solid var(--line); padding-block: 20px 40px; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sheet { grid-template-columns: 1fr; }
  .sheet > .frame { max-width: 240px; }
  .count { margin-left: 0; width: 100%; }
  .bar { position: static; }
}

/* Navigation + pages guide */
.unoff { background: var(--accent); color: #fff; font: 600 13px/1.35 var(--body); text-align: center; padding: 7px 16px; }
.topnav { position: sticky; top: 0; z-index: 8; border-bottom: 1px solid var(--line); background: var(--surface); }
